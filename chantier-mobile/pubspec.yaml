name: chantier_mobile
description: "Chantier : saisie terrain hors ligne (chef de chantier, chefs d'equipe)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.9.2

# Versions resolues pour Flutter 3.35.7 / Dart 3.9.2 (ADR 0008 : on ne monte pas Flutter sans ADR).
# Plafonds a connaitre : bloc_test -> test -> test_api 0.7.6 (impose par flutter_test) borne
# `analyzer` a < 8, donc drift 2.28, drift_dev 2.28, freezed 3.0, json_serializable 6.9 et json_annotation 4.9.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Etat, injection, navigation (conventions Kardinal)
  flutter_bloc: ^9.1.1
  equatable: ^3.0.0
  get_it: ^9.3.0
  go_router: ^17.2.3

  # Reseau et stockage des jetons
  dio: ^5.11.1
  flutter_secure_storage: ^10.3.4
  connectivity_plus: ^7.3.2
  shared_preferences: ^2.5.5

  # Base locale
  drift: ^2.28.0
  # drift_flutter 0.2.7 exige drift >= 2.29 sans le declarer (isolateDebugLog) : plafonne a 0.2.6.
  drift_flutter: '>=0.2.5 <0.2.7'
  sqlite3_flutter_libs: ^0.5.42

  # Modeles, i18n, divers
  decimal: ^3.2.7
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0
  intl: ^0.20.2
  logging: ^1.3.0
  retrofit: 4.4.2
  image_picker: ^1.2.2
  path_provider: ^2.1.5
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.5
  sqlite3: ^2.9.4

  # Generation de code (build_runner)
  build_runner: ^2.5.4
  drift_dev: ^2.28.0
  freezed: ^3.0.0
  json_serializable: ^6.9.5
  retrofit_generator: 9.1.9
  swagger_parser: 1.46.0
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
  generate: true

  # Police Cairo (SIL OFL, voir assets/fonts/OFL.txt) embarquee : aucun telechargement a l'execution.
  # Une seule police variable ; les graisses grasses sont obtenues par Flutter.
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Variable.ttf
